<header class="header-shell">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid header-inner">
      <a class="navbar-brand fw-bold text-info" routerLink="/products">TECH STORE</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/products" routerLinkActive="active">Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/users" routerLinkActive="active">Usuarios</a>
          </li>
        </ul>

        <div class="header-right d-flex align-items-center gap-3">
          <span class="user-chip text-white px-2">
            Hola, {{ currentUser()?.name || currentUser()?.username }}
          </span>

          <a
            routerLink="/cart"
            class="text-white text-decoration-none d-flex align-items-center gap-2 cart-link"
          >
            🛒
            <span
              >Total:
              <strong>{{
                cartService.totalCartPrice() | currency: 'COP' : 'symbol-narrow' : '1.0-0'
              }}</strong></span
            >
          </a>

          <button class="btn btn-sm btn-outline-danger" type="button" (click)="logout()">
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </nav>
</header>
