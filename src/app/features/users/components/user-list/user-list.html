<main class="user-list-page">
  <div class="section-header">
    <h1 class="page-title">Listado de usuarios</h1>
    <button class="btn btn-primary btn-create-user" routerLink="/users/new">Crear Usuario</button>
  </div>

  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 row-cols-lg-3 g-4 mt-4 user-grid">
    @for (user of users(); track user.username) {
      <app-user-card
        [info]="user"
        (details)="showDetail($event)"
        (remove)="removeUser($event)"
      ></app-user-card>
    }
  </div>
</main>
